# Unattended corpus growth.
#
# Runs the autofill pipeline on a schedule, and opens a pull request rather than pushing
# to a branch anyone deploys from. That is the one place this workflow deliberately stops
# short of "no manual intervention": the pipeline can decide what to add, and a diff is
# still the cheapest place to notice that a rule has drifted. Everything up to the PR is
# automatic — discovery, authoring, the gate, the corpus rebuild, and the test suite.
#
# Enable it by adding an ANTHROPIC_API_KEY repository secret. Without one the job exits
# early with a note rather than failing, so a fork does not show a permanently red badge.
#
# To let it commit straight to the branch instead, replace the create-pull-request step
# with a push. Do that only once a few PRs have gone by clean.

name: autofill

on:
  schedule:
    # 04:20 UTC daily. The theory arm has 290 entries to work through and is the default,
    # so at five a run the corpus completes in about two months without anyone present.
    # The fallacy arm's seed list is finite; run that one on demand once it is exhausted.
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Entries to add in this run'
        required: false
        default: '5'
      sources:
        description: 'Comma-separated discovery adapters (fallacies only)'
        required: false
        default: 'seed'
      kind:
        description: 'fallacies or theories'
        required: false
        default: 'theories'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One run at a time: two concurrent runs would both rewrite the generated file whole
  # and the loser's entries would vanish.
  group: autofill
  cancel-in-progress: false

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check for a key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "No ANTHROPIC_API_KEY secret set — running the pipeline in dry-run mode."
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      # Always runs, both arms, so a broken pipeline is caught on a repository with no
      # key configured at all. Each dry run exits non-zero if its gate stops rejecting
      # the deliberately broken probe.
      - name: Dry run
        run: |
          npm run autofill -- --kind fallacies --dry-run --sources "${{ inputs.sources || 'seed' }}"
          npm run autofill -- --kind theories --dry-run

      - name: Author and gate
        if: steps.key.outputs.have_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run autofill -- \
            --kind "${{ inputs.kind || 'theories' }}" \
            --write \
            --limit "${{ inputs.limit || 5 }}" \
            --sources "${{ inputs.sources || 'seed' }}"

      # The gate decides what enters the file; these decide whether the repository still
      # works with it in. A run that produces entries the build or the suite rejects must
      # not open a PR.
      - name: Rebuild the corpus
        if: steps.key.outputs.have_key == 'true'
        run: npm run corpus

      - name: Test
        if: steps.key.outputs.have_key == 'true'
        run: npm test

      - name: Build
        if: steps.key.outputs.have_key == 'true'
        run: npm run build

      # The run log is gitignored on purpose: committing it to a rolling branch produces
      # a conflict on every run. Kept as an artifact instead, which is where you look
      # when tuning the gate — it carries every rejection reason from every run.
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofill-log
          path: autofill.log.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Open a pull request
        if: steps.key.outputs.have_key == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: autofill/corpus
          # One rolling branch: a run adds to the open PR rather than opening a new one
          # every week.
          title: 'autofill: new corpus entries'
          commit-message: 'autofill: add generated corpus entries'
          body: |
            Generated by `.github/workflows/autofill.yml`.

            Every entry in this diff cleared its gate, and the corpus rebuild, the test
            suite and the production build all passed with these entries in.

            - **Theory entries** (`theories/*.md`) cleared
              `scripts/validate-theories.mjs` — the same validator every hand-written
              entry clears, including the load-bearing-axis rule.
            - **Fallacy entries** (`data/fallacies.generated.mjs`) cleared
              `scripts/autofill/gate.mjs`: structure, originality against any fetched
              source text, distinctness from existing entries, house style, and two
              honesty checks.

            **Clearing a gate is not the same as being right.** Nothing here has been
            read by a person. What a reviewer should look for:

            - Are the cited sources real, and does the entry represent the thinker's
              actual position? No gate can check this and it is the likeliest error.
            - Are the options genuinely defensible, or is it one right answer and three
              strawmen wearing score vectors?
            - On a fallacy entry: does `notFallacy` concede a real legitimate case, or
              has it found a form of words that satisfies the check without conceding
              anything?

            To fix a fallacy entry, move it into `data/fallacies.mjs` and correct it
            there — the corpus builder prefers hand-written entries on an id collision.
            To reject one permanently, delete it and add its id to `REJECTED` in
            `scripts/autofill/cli.mjs`, or a later run will add it back. A theory entry
            is just a file: correct it in place, or delete it to have it re-authored.
          labels: autofill
          add-paths: |
            data/fallacies.generated.mjs
            theories/
            web/src/corpus.generated.json
